name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SIDDH31
          outputs: |
            dist/github-snake.svg?color_snake=#ffffff&color_dots=#ebe1d3,#c4a274,#8b5e34,#5c3d1e,#3a2314
            dist/github-snake-dark.svg?color_snake=#ffffff&color_dots=#ebe1d3,#c4a274,#8b5e34,#5c3d1e,#3a2314
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
